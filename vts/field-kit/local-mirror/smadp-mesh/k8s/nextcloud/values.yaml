# Nextcloud + MariaDB — SMADP / GrokOS (Helm values, no secrets)
# Ingress host: Tailscale MagicDNS um690.taile52ad9.ts.net (not nextcloud.um690...)

global:
  security:
    allowInsecureImages: true

image:
  flavor: apache

replicaCount: 1

nextcloud:
  host: um690.taile52ad9.ts.net
  username: admin
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  trustedDomains:
    - um690.taile52ad9.ts.net
    - 100.120.232.39
    - 192.168.20.100
    - 192.168.20.101
    - 192.168.20.102
  configs:
    smadp-proxy.config.php: |-
      <?php
      $CONFIG = array(
        'trusted_proxies' => array('10.42.0.0/16', '10.43.0.0/16', '100.64.0.0/10'),
        'overwritehost' => 'um690.taile52ad9.ts.net',
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://um690.taile52ad9.ts.net',
      );

internalDatabase:
  enabled: false

mariadb:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
  global:
    defaultStorageClass: longhorn
  auth:
    database: nextcloud
    username: nextcloud
  architecture: standalone
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-nextcloud-headers@kubernetescrd,nextcloud-nextcloud-buffering@kubernetescrd
  tls:
    - hosts:
        - um690.taile52ad9.ts.net
      secretName: nextcloud-tailscale-tls
  path: /
  pathType: Prefix

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 20Gi

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

livenessProbe:
  initialDelaySeconds: 60
readinessProbe:
  initialDelaySeconds: 60