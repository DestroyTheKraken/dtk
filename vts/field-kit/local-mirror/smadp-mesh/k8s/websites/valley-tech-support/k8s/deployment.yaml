apiVersion: apps/v1
kind: Deployment
metadata:
  name: valley-tech-support
  namespace: websites
  labels:
    app.kubernetes.io/name: valley-tech-support
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valley-tech-support
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valley-tech-support
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: um690
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: site
          configMap:
            name: valley-tech-static
        - name: nginx-config
          configMap:
            name: valley-tech-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valley-tech-nginx
  namespace: websites
  labels:
    app.kubernetes.io/name: valley-tech-support
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        gzip on;
        gzip_types text/css application/javascript text/html application/json;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: valley-tech-support
  namespace: websites
  labels:
    app.kubernetes.io/name: valley-tech-support
spec:
  selector:
    app.kubernetes.io/name: valley-tech-support
  ports:
    - name: http
      port: 80
      targetPort: http