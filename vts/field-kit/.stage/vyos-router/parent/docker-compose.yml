# Netdata Parent — um690 (or your control host). Host network = port 19999 on all interfaces.
# Restrict with UFW/Tailscale ACLs. Do NOT port-forward 19999 to the public internet.
#
# runtime/ is created by install-parent.sh (API key + stream.conf).

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata-parent
    hostname: netdata-parent
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - ./runtime/stream.conf:/etc/netdata/stream.conf:ro
      - ./runtime/health_alarm_notify.conf:/etc/netdata/health_alarm_notify.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdata-lib:
  netdata-cache:
