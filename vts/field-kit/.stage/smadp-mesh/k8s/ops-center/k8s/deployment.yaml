apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-center
  namespace: ops-center
  labels:
    app.kubernetes.io/name: ops-center
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-center
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: um690
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: site
          configMap:
            name: ops-center-static
        - name: nginx-config
          configMap:
            name: ops-center-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-center-nginx
  namespace: ops-center
  labels:
    app.kubernetes.io/name: ops-center
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|svg|webmanifest)$ {
            add_header Cache-Control "public, max-age=3600";
        }

        gzip on;
        gzip_types text/css application/javascript text/html application/json image/svg+xml;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ops-center
  namespace: ops-center
  labels:
    app.kubernetes.io/name: ops-center
spec:
  selector:
    app.kubernetes.io/name: ops-center
  ports:
    - name: http
      port: 80
      targetPort: http