# VyOS configuration — enable GrokOS network admin from um690 only
#
# Apply on VyOS (console or existing mgmt session):
#   configure
#   load commands file /path/to/vyos-enable-grok-mgmt.conf
#   # OR paste set/delete lines below
#   commit
#   save
#
# Replace GROK_SSH_PUBKEY_LINE with output of:
#   cat ~/.ssh/id_ed25519.pub   # on um690, or dedicated vyos key from setup script
#
# Sovereignty: only um690 (192.168.20.100) + um690 Tailscale may SSH to router.
# Segmentation: does NOT open .20 → .10 host forwarding.

# --- SSH service (listen on mgmt + lab gateway IPs) ---
set service ssh port 22
set service ssh listen-address 192.168.10.1
set service ssh listen-address 192.168.20.1

# --- Grok / um690 SSH key for user vyos ---
# Delete placeholder after substituting real key:
# delete system login user vyos authentication public-keys grokos
set system login user vyos authentication public-keys grokos key GROK_SSH_KEY_BLOB_ONLY
set system login user vyos authentication public-keys grokos type ssh-ed25519

# --- INPUT firewall: allow SSH to router ONLY from um690 ---
# Adjust chain names if your VyOS uses zone-policy (see vyos-audit.sh output).

set firewall ipv4 input filter rule 10 action accept
set firewall ipv4 input filter rule 10 description 'GrokOS um690 SSH'
set firewall ipv4 input filter rule 10 protocol tcp
set firewall ipv4 input filter rule 10 destination port 22
set firewall ipv4 input filter rule 10 source address 192.168.20.100

set firewall ipv4 input filter rule 11 action accept
set firewall ipv4 input filter rule 11 description 'GrokOS um690 Tailscale SSH'
set firewall ipv4 input filter rule 11 protocol tcp
set firewall ipv4 input filter rule 11 destination port 22
set firewall ipv4 input filter rule 11 source address 100.120.232.39

set firewall ipv4 input filter rule 100 action drop
set firewall ipv4 input filter rule 100 description 'Drop SSH to router from others'
set firewall ipv4 input filter rule 100 protocol tcp
set firewall ipv4 input filter rule 100 destination port 22

# --- Lab DHCP static reservations (fix node1 IP conflict) ---
# OPTIONAL: adjust shared-network-name / subnet path to match your VyOS config.
# Run 'show configuration commands | grep dhcp' before applying.
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping um690 ip-address 192.168.20.100
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping um690 mac-address '58:47:ca:70:aa:02'
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping node1 ip-address 192.168.20.101
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping node1 mac-address 'd8:cb:8a:01:7a:89'
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping node2 ip-address 192.168.20.102
set service dhcp-server shared-network-name LAB subnet 192.168.20.0/24 static-mapping node2 mac-address '44:8a:5b:dd:a0:c5'

# --- Lab subnet: no IPv6 router advertisements (prevents broken v6 on workers) ---
# If ipv6 is enabled on lab, either fully route or disable RA — half-config causes 10s delays.
# delete protocols router-advert interface ethX